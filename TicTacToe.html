<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background: yellowgreen;
}

nav{
    background:#250925;
    color:white;
    height:60px;
    display:flex;
    align-items:center;
    padding:0 20px;
    font-size:25px;
    font-family:Verdana;
}

.gameContainer{
    display:flex;
    justify-content:center;
    align-items:center;
    margin-top:50px;
    gap:50px;
    flex-wrap:wrap;
}

.container{
    display:grid;
    grid-template-columns:repeat(3,100px);
    grid-template-rows:repeat(3,100px);
}

.box{
    border:2px solid black;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:60px;
    cursor:pointer;
    background:white;
}

.box:hover{
    background: pink;
}

.gameInfo h1{
    margin-bottom:20px;
}

.info{
    font-size:22px;
    font-weight:bold;
}

button{
    padding:8px 18px;
    margin-left:15px;
    cursor:pointer;
    font-size:16px;
}

.imgbox img{
    width:220px;
    margin-top:20px;
    display:none;
}

.br-0{
    border-right:none;
}

.bl-0{
    border-left:none;
}

.bt-0{
    border-top:none;
}

.bb-0{
    border-bottom:none;
}
</style>

</head>
<body>

<nav>
    <ul>
        <li>My Tic Tac Toe</li>
    </ul>
</nav>

<div class="gameContainer">

    <div class="container">

        <div class="box bt-0 bl-0"><span class="boxtext"></span></div>
        <div class="box bt-0"><span class="boxtext"></span></div>
        <div class="box bt-0 br-0"><span class="boxtext"></span></div>

        <div class="box bl-0"><span class="boxtext"></span></div>
        <div class="box"><span class="boxtext"></span></div>
        <div class="box br-0"><span class="boxtext"></span></div>

        <div class="box bl-0 bb-0"><span class="boxtext"></span></div>
        <div class="box bb-0"><span class="boxtext"></span></div>
        <div class="box bb-0 br-0"><span class="boxtext"></span></div>

    </div>

    <div class="gameInfo">

        <h1>Welcome to Tic Tac Toe</h1>

        <span class="info">Turn for X</span>

        <button id="reset">Reset</button>

        <div class="imgbox">
            <img src="https://media.tenor.com/jkVthFR60pgAAAAi/feliz-cumplea%C3%B1os.gif">
        </div>

    </div>

</div>

<script>

console.log("Welcome to Tic Tac Toe");

//Sounds
const music = new Audio("music.mp3");
const clickSound = new Audio("clickSound.mp3");
const winSound = new Audio("winSound.mp3");
const drawSound = new Audio("gameDrow.mp3");

music.loop = true;
music.volume = 0.3;

// Browser autoplay fix
document.addEventListener("click", () => {
    music.play().catch(() => {});
}, { once: true });



let turn = "X";
let gameOver = false;

const changeTurn = () => {
    return turn === "X" ? "O" : "X";
};

// Winner Check
const checkWin = () => {

    let boxtexts = document.getElementsByClassName("boxtext");

    let wins = [
        [0,1,2],
        [3,4,5],
        [6,7,8],
        [0,3,6],
        [1,4,7],
        [2,5,8],
        [0,4,8],
        [2,4,6]
    ];

    wins.forEach(e => {

        if(
            boxtexts[e[0]].innerText !== "" &&
            boxtexts[e[0]].innerText === boxtexts[e[1]].innerText &&
            boxtexts[e[1]].innerText === boxtexts[e[2]].innerText
        ){

            gameOver = true;

            music.pause();

            winSound.currentTime = 0;
            winSound.play();

            document.querySelector(".info").innerText =
            boxtexts[e[0]].innerText + " Won 🎉";

            document.querySelector(".imgbox img").style.display = "block";
        }

    });

};


// Draw Check
const checkDraw = () => {

    let boxtexts = document.getElementsByClassName("boxtext");

    let filled = true;

    Array.from(boxtexts).forEach(box => {

        if(box.innerText === ""){
            filled = false;
        }

    });

    if(filled && !gameOver){

        gameOver = true;

        music.pause();

        drawSound.currentTime = 0;
        drawSound.play();

        document.querySelector(".info").innerText =
        "Match Draw 🤝";

    }

};


// Game Logic
let boxes = document.getElementsByClassName("box");

Array.from(boxes).forEach(element => {

    let boxtext = element.querySelector(".boxtext");

    element.addEventListener("click", () => {

        if(boxtext.innerText === "" && !gameOver){

            clickSound.currentTime = 0;
            clickSound.play();

            boxtext.innerText = turn;

            checkWin();

            checkDraw();

            if(!gameOver){

                turn = changeTurn();

                document.querySelector(".info").innerText =
                "Turn for " + turn;

            }

        }

    });

});


// Reset Button
document.getElementById("reset").addEventListener("click", () => {

    let boxtexts = document.querySelectorAll(".boxtext");

    boxtexts.forEach(box => {
        box.innerText = "";
    });

    turn = "X";
    gameOver = false;

    document.querySelector(".info").innerText = "Turn for X";

    document.querySelector(".imgbox img").style.display = "none";

    music.currentTime = 0;
    music.play();

});

</script>

</body>
</html>
